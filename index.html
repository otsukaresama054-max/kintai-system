<!--
  この画面はGitHub Pagesなど「静的ページ」として公開して使うファイルです。
  Google Apps Script(GAS)にそのままHTMLとして貼るものではありません。
  (Apps ScriptのHtmlServiceが自動でページをiframeの中に入れてしまう仕様と、
   LINEログインの仕組みが相性が悪く、正しく動かないための構成変更です)

  公開後、下の「設定」セクションにある2つの値を、実際の値に書き換えてください:
    - LIFF_ID   … LINE Developersで発行されたLIFF ID
    - SCRIPT_URL … Google Apps Scriptの「デプロイ」で発行された .../exec のURL
-->
<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <title>出退勤管理</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; }

    /* 会社のテーマカラー(ブルー系)。ここの3色を変えるだけで全体の色味を調整できる。 */
    :root {
      --brand-primary: #1d4ed8;   /* 出勤ボタンの色(明るめの青) */
      --brand-secondary: #1e3a5f; /* 退勤ボタンの色(濃紺) */
      --brand-bg: #eef3fb;        /* 背景の薄い青 */
      --brand-text: #1e2a3a;      /* 見出しの濃い青系テキスト */
    }

    html, body {
      height: 100%;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      color: #222;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--brand-primary);
    }

    /* 上部の色帯(ヘッダー)。画面上部を占めて「アプリらしさ」を出す。 */
    .header {
      background: linear-gradient(160deg, var(--brand-primary), var(--brand-secondary));
      color: #fff;
      text-align: center;
      padding: 44px 12px 60px;
      flex-shrink: 0;
    }

    /* ヘッダーの下に重なるように配置する、白い「シート」。
       画面の残り高さいっぱいに広がるが、中のカードは無理に
       引き伸ばさず、ほどよいサイズのまま縦方向中央に置く
       (画面いっぱいに引き伸ばすと間延びして不格好になったため)。 */
    .sheet {
      flex: 1;
      background: var(--brand-bg);
      border-radius: 28px 28px 0 0;
      margin-top: -32px;
      padding: 22px 6px 26px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .card {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      background: #fff;
      border-radius: 30px;
      box-shadow: 0 8px 28px rgba(30, 58, 95, 0.14);
      padding: 44px 14px;
    }

    /* 現在時刻の表示。実用性を兼ねつつ、画面の余白を自然に埋める役割も持たせる。 */
    #clock {
      text-align: center;
    }
    #clockTime {
      font-size: 130px;
      font-weight: 700;
      color: var(--brand-text);
      letter-spacing: 0.01em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    #clockDate {
      font-size: 26px;
      color: #6b7c93;
      margin-top: 12px;
    }

    h1 {
      font-size: 80px;
      font-weight: 700;
      text-align: center;
      margin: 0;
      color: #fff;
      letter-spacing: 0.01em;
      line-height: 1.1;
    }
    .headerSub {
      text-align: center;
      color: rgba(255,255,255,0.85);
      font-size: 18px;
      margin-top: 10px;
      letter-spacing: 0.1em;
    }
    #userInfo {
      text-align: center;
      color: #5b6b82;
      font-size: 24px;
      margin-top: 20px;
      min-height: 30px;
    }
    .topGroup {
      margin-bottom: 44px;
    }
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 26px;
      margin-bottom: 34px;
    }
    button.punch {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      font-size: 70px;
      font-weight: bold;
      padding: 34px 0;
      border: none;
      border-radius: 24px;
      color: #fff;
      cursor: pointer;
      letter-spacing: 0.06em;
      box-shadow: 0 4px 10px rgba(30, 58, 95, 0.28);
      transition: opacity 0.15s, transform 0.1s;
    }
    button.punch:active {
      transform: scale(0.98);
    }
    button.punch:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
    }
    button.punch svg {
      width: 58px;
      height: 58px;
      flex-shrink: 0;
    }
    #btnCheckIn { background: var(--brand-primary); }
    #btnCheckOut { background: var(--brand-secondary); }

    #status {
      padding: 24px 24px;
      border-radius: 18px;
      background: #fff;
      /* border-radiusと相性の悪い border-left の代わりに、
         内側に食い込む影(inset box-shadow)でアクセントの縦線を表現する。
         overflow: hidden で角丸からのはみ出しも確実に防ぐ。 */
      box-shadow: inset 5px 0 0 #c9d6e8, 0 1px 4px rgba(0,0,0,0.06);
      overflow: hidden;
      font-size: 21px;
      line-height: 1.6;
      white-space: pre-wrap;
      min-height: 24px;
    }
    #status.error { color: #b3261e; box-shadow: inset 5px 0 0 #b3261e, 0 1px 4px rgba(0,0,0,0.06); }
    #status.success { color: #1b6e3c; box-shadow: inset 5px 0 0 #1b6e3c, 0 1px 4px rgba(0,0,0,0.06); }
  </style>
</head>
<body>
  <div class="header">
    <h1>出退勤管理</h1>
    <div class="headerSub">ATTENDANCE SYSTEM</div>
  </div>

  <div class="sheet">
    <div class="card">
      <div class="topGroup">
        <div id="clock">
          <div id="clockTime">--:--</div>
          <div id="clockDate">----年--月--日(-)</div>
        </div>
        <div id="userInfo">読み込み中...</div>
      </div>

      <div class="buttons">
        <button id="btnCheckIn" class="punch">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
            <polyline points="10 17 15 12 10 7"></polyline>
            <line x1="15" y1="12" x2="3" y2="12"></line>
          </svg>
          出　勤
        </button>
        <button id="btnCheckOut" class="punch">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          退　勤
        </button>
      </div>

      <div id="status">準備中です。しばらくお待ちください。</div>
    </div>
  </div>

  <script>
    // ▼▼▼ 設定:ここを実際の値に書き換えてください ▼▼▼
    var LIFF_ID = '2011469495-IbQsJ1Ps'; // LINE Developersで発行されたLIFF ID
    var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz8lcWX93fSPXndnYCxqD8dq3NIzX2gc76kwaZPjOPlwuvdXf7poRx8Q01ztLAnMvKL/exec'; // Apps Scriptの .../exec URL
    // ▲▲▲ ここまで ▲▲▲

    var statusEl = document.getElementById('status');
    var userInfoEl = document.getElementById('userInfo');
    var btnCheckIn = document.getElementById('btnCheckIn');
    var btnCheckOut = document.getElementById('btnCheckOut');
    var clockTimeEl = document.getElementById('clockTime');
    var clockDateEl = document.getElementById('clockDate');

    var WEEKDAY_JA = ['日', '月', '火', '水', '木', '金', '土'];

    function pad2_(n) {
      return n < 10 ? '0' + n : String(n);
    }

    // 画面上部の現在時刻表示を更新する(1秒ごとに呼ばれる)。
    function updateClock_() {
      var now = new Date();
      clockTimeEl.textContent = pad2_(now.getHours()) + ':' + pad2_(now.getMinutes());
      clockDateEl.textContent =
        now.getFullYear() + '年' + pad2_(now.getMonth() + 1) + '月' + pad2_(now.getDate()) + '日' +
        '(' + WEEKDAY_JA[now.getDay()] + ')';
    }
    updateClock_();
    setInterval(updateClock_, 1000);

    function setStatus(message, kind) {
      statusEl.textContent = message;
      statusEl.className = kind || '';
    }

    function setButtonsDisabled(disabled) {
      btnCheckIn.disabled = disabled;
      btnCheckOut.disabled = disabled;
    }

    function init() {
      if (LIFF_ID === 'YOUR_LIFF_ID_HERE' || SCRIPT_URL === 'YOUR_GAS_EXEC_URL_HERE') {
        setStatus(
          'このページ上部の LIFF_ID / SCRIPT_URL がまだ書き換えられていません。\n' +
            'index.html を編集して、実際の値を入力してください。',
          'error'
        );
        return;
      }

      // LIFFのSDK本体(static.line-scdn.net から読み込む<script>)がブロックされている
      // (社内ネットワークの制限など)と liff オブジェクト自体が存在せず、
      // liff.init を呼んだ瞬間に画面に何も表示されないまま固まって見える。
      // まずそれを検知してハッキリ表示する。
      if (typeof liff === 'undefined') {
        setStatus(
          'LIFFの部品(SDK)を読み込めませんでした。\n' +
            'ネットワーク環境(社内Wi-Fiなど)が原因の可能性があります。\n' +
            'モバイル回線に切り替えるか、別のネットワークで開き直してください。',
          'error'
        );
        return;
      }

      // liff.init が何らかの理由で応答しないまま固まった場合に備え、
      // 一定時間で「固まっている」ことが分かるようタイムアウトを設ける。
      var initTimedOut = false;
      var timeoutId = setTimeout(function () {
        initTimedOut = true;
        setStatus(
          '読み込みに時間がかかりすぎています。\n' +
            '画面を閉じて開き直すか、別のネットワーク(モバイル回線⇔Wi-Fi)で試してください。',
          'error'
        );
      }, 12000);

      try {
        liff
          .init({ liffId: LIFF_ID })
          .then(function () {
            clearTimeout(timeoutId);
            if (initTimedOut) return; // 既にタイムアウト表示済みなら何もしない
            if (!liff.isLoggedIn()) {
              liff.login();
              return;
            }
            setButtonsDisabled(false);
            setStatus('位置情報の利用を許可すると打刻できます。');
            return liff.getProfile().then(function (profile) {
              // 画面表示用の参考情報。記録される氏名はサーバー側の社員マスタが正。
              userInfoEl.textContent = 'ログイン中: ' + profile.displayName;
            });
          })
          .catch(function (err) {
            clearTimeout(timeoutId);
            if (initTimedOut) return;
            setStatus('LIFFの初期化に失敗しました: ' + (err && err.message ? err.message : err), 'error');
          });
      } catch (syncErr) {
        // liff.init 自体が同期的に例外を投げた場合(SDKの読み込み不備など)の保険。
        clearTimeout(timeoutId);
        setStatus('LIFFの初期化中にエラーが発生しました: ' + syncErr.message, 'error');
      }
    }

    function punch(type) {
      setButtonsDisabled(true);
      setStatus('位置情報の取得を確認しています…(許可ダイアログが表示されます)');

      if (!navigator.geolocation) {
        setStatus('この端末では位置情報が利用できないため、打刻できません。', 'error');
        setButtonsDisabled(false);
        return;
      }

      navigator.geolocation.getCurrentPosition(
        function (position) {
          sendPunch(type, position.coords.latitude, position.coords.longitude);
        },
        function (error) {
          // 拒否・タイムアウト・取得失敗など。打刻はさせないが、
          // 「拒否された事実」は時刻付きでサーバーに記録してもらう。
          reportLocationDenied(type, error);
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0, // キャッシュされた古い位置情報は使わず、必ず最新を取得する
        }
      );
    }

    // navigator.geolocation の GeolocationPositionError.code の意味
    // (1: PERMISSION_DENIED, 2: POSITION_UNAVAILABLE, 3: TIMEOUT)
    var GEOLOCATION_ERROR_REASONS = {
      1: 'PERMISSION_DENIED(位置情報の利用が許可されなかった)',
      2: 'POSITION_UNAVAILABLE(位置情報を取得できなかった)',
      3: 'TIMEOUT(位置情報の取得がタイムアウトした)',
    };

    function reportLocationDenied(type, error) {
      var reason =
        (error && GEOLOCATION_ERROR_REASONS[error.code]) ||
        (error && error.message) ||
        '不明な理由';

      setStatus('位置情報が取得できなかったため、その旨を記録しています…');

      var idToken = liff.getIDToken && liff.getIDToken();
      if (!idToken) {
        // 本人確認ができないと記録もできないため、ローカルにだけ表示する。
        setStatus(
          '位置情報の取得が許可されなかった(または失敗した)ため、打刻できませんでした。\n' +
            '設定から位置情報の利用を許可して、もう一度お試しください。\n' +
            '(理由: ' + reason + ')',
          'error'
        );
        setButtonsDisabled(false);
        return;
      }

      postToServer({ idToken: idToken, type: type, locationDenied: true, reason: reason })
        .then(function (result) {
          if (result.denied) {
            setStatus(
              '位置情報の取得が許可されなかった(または失敗した)ため、打刻できませんでした。\n' +
                '設定から位置情報の利用を許可して、もう一度お試しください。\n' +
                '(拒否した記録: ' + result.date + ' ' + result.time + ')',
              'error'
            );
          } else {
            // 本人確認自体に失敗した場合など。拒否の記録も残せていない。
            setStatus('位置情報の記録に失敗しました: ' + result.message, 'error');
          }
        })
        .catch(function (err) {
          setStatus(
            '位置情報の取得が許可されなかったため打刻できず、さらに記録の保存にも失敗しました: ' + err.message,
            'error'
          );
        })
        .finally(function () {
          setButtonsDisabled(false);
        });
    }

    function sendPunch(type, lat, lng) {
      setStatus('打刻を送信しています…');

      var idToken = liff.getIDToken && liff.getIDToken();
      if (!idToken) {
        setStatus('LINEログイン情報が取得できませんでした。アプリを開き直してください。', 'error');
        setButtonsDisabled(false);
        return;
      }

      postToServer({ idToken: idToken, type: type, lat: lat, lng: lng })
        .then(function (result) {
          if (result.ok) {
            setStatus(
              result.type + 'を記録しました。\n' +
                result.date + ' ' + result.time + '\n' +
                result.address,
              'success'
            );
          } else {
            setStatus('打刻に失敗しました: ' + result.message, 'error');
          }
        })
        .catch(function (err) {
          setStatus('通信エラーにより打刻に失敗しました: ' + err.message, 'error');
        })
        .finally(function () {
          setButtonsDisabled(false);
        });
    }

    // GASのWebアプリ(doPost)にJSONを送信する共通処理。
    function postToServer(payload) {
      return fetch(SCRIPT_URL, {
        method: 'POST',
        // "text/plain" にすることでブラウザのCORSプリフライト(OPTIONS)を回避する。
        // GAS側では e.postData.contents をJSON.parseして扱う。
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload),
      }).then(function (res) { return res.json(); });
    }

    btnCheckIn.addEventListener('click', function () { punch('出勤'); });
    btnCheckOut.addEventListener('click', function () { punch('退勤'); });
    setButtonsDisabled(true);

    init();
  </script>
</body>
</html>
